name: CI

on:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMARTRAIL_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The API tests start the real Grilled service, so it must be built first.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/grilled/package-lock.json
      - run: npm --prefix services/grilled ci
      - run: npm --prefix services/grilled run build
      - run: dotnet build services/api/SmartRail.Api.csproj --configuration Release
      # The local stack's wiring (addresses, secrets, storage) must keep compiling.
      - run: dotnet build services/apphost/SmartRail.AppHost.csproj --configuration Release
      - run: dotnet test tests/SmartRail.Api.Tests --configuration Release
      - run: docker build -f services/api/Dockerfile .

  grilled:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/grilled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/grilled/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The signed callback examples both services check must match the script that makes them.
      - run: node scripts/make-callback-fixtures.js && git diff --exit-code -- fixtures
      - run: docker build -f ../../services/grilled/Dockerfile ../..
