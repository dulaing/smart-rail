name: CI

on:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMARTRAIL_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The API tests start the real RailBites service, so it must be built first.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/railbites/package-lock.json
      - run: npm --prefix services/railbites ci
      - run: npm --prefix services/railbites run build
      - run: dotnet build services/api/SmartRail.Api.csproj --configuration Release
      - run: dotnet test tests/SmartRail.Api.Tests --configuration Release
      - run: docker build -f services/api/Dockerfile .

  railbites:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/railbites
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/railbites/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: docker build -f ../../services/railbites/Dockerfile ../..
