name: smartrail_core
description: "SmartRail design foundation for the Flutter apps: generated tokens, theme, StatusBadge, FreshnessLine and the freshness rule."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Noto Sans, Abhaya Libre (Sinhala) and Noto Sans Tamil render offline.
  # SIL OFL licences sit next to the files. Noto fonts are variable;
  # the user-approved Sinhala reference uses Abhaya Libre Regular.
  fonts:
    - family: NotoSans
      fonts:
        - asset: fonts/NotoSans-Variable.ttf
    - family: AbhayaLibre
      fonts:
        - asset: fonts/AbhayaLibre-Regular.ttf
          weight: 400
    - family: NotoSansTamil
      fonts:
        - asset: fonts/NotoSansTamil-Variable.ttf
