name: driver_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  cronet_http: ^1.10.0
  flutter:
    sdk: flutter
  flutter_appauth: ^12.1.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  http: ^1.6.0
  intl: any
  path_provider: ^2.1.6
  smartrail_core:
    path: ../../packages/smartrail_core
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/figma/
    - assets/fonts/OFL-NotoSansMath.txt
  fonts:
    - family: DriverSymbols
      fonts:
        - asset: assets/fonts/NotoSansMath-Regular.ttf
